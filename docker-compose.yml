services:
  db:
    image: postgres:16-alpine
    container_name: django_db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - julian_network

  django_app:
    image: sadiyairin/hhm-backend:latest
    container_name: django_app
    restart: always
    expose:
      - "8005"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    networks:
      - julian_network

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    depends_on:
      - django_app
    networks:
      - julian_network

networks:
  julian_network:
    driver: bridge

volumes:
  postgres_data: # এই ভলিউমটি আপনার ডেটাবেস পারসিস্টেন্ট রাখবে
