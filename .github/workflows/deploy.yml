name: Deploy juliangarc11 to VPS

on:
    push:
        branches:
            - main # আপনি যদি অন্য কোনো ব্রাঞ্চ ব্যবহার করেন তবে সেটি দিন

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            # ১. Docker Hub-এ লগইন
            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # ২. ইমেজ বিল্ড এবং পুশ (পুরনো ক্যাশ ডিলিট সহ)
            - name: Build and Push Image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  no-cache: true # এটি নিশ্চিত করবে আপনার নতুন Uvicorn সেটিংস ইমেজে যাবে
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/juliangarc11:latest

            # ৩. VPS-এ লগইন করে Docker Compose এর মাধ্যমে আপডেট করা
            - name: Deploy to VPS via SSH
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      # আপনার প্রজেক্ট ফোল্ডারে প্রবেশ করুন
                      cd /app/hhm-backend

                      # ডকার হাব ইউজারনেম এনভায়রনমেন্ট ভেরিয়েবল হিসেবে সেট করা
                      export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

                      # নতুন ইমেজ পুল করা
                      docker compose pull

                      # কন্টেইনার আপডেট করা
                      # এটি নিজে থেকেই django_app আপডেট করবে কিন্তু Nginx এবং SSL সচল রাখবে
                      docker compose up -d --remove-orphans
